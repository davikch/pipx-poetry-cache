name: Setup Poetry with pipx or use the cached version
runs-on: ubuntu-slim

inputs:
  python-version:
    required: true
  poetry-version:
    required: true
  command:
    description: Command to run with 'poetry run'
    required: false

runs:
  using: composite
  steps:
    - id: find-pipx
      name: Get pipx installation path
      shell: bash
      continue-on-error: true
      run: |
        PIPX_VENV="$(pipx environment --value PIPX_LOCAL_VENVS)"

        if [ -z "$PIPX_VENV" ]; then
          exit 1
        fi

        echo "pipx-path=$PIPX_VENV" >> "$GITHUB_OUTPUT"

    - if: ${{ steps.find-pipx.outcome == 'success' }}
      run: |
        echo "path is ${{ steps.find-pipx.outputs.pipx-path }}"
      shell: bash

    - if: ${{ steps.find-pipx.outcome == 'success' }}
      id: use-cache
      uses: actions/cache@v6
      with:
        path: "${{ steps.find-pipx.outputs.pipx-path }}/poetry"
        key: ${{ runner.os }}-poetry-${{ inputs.poetry-version }}

    - if: ${{ steps.find-pipx.outcome == 'failure' || steps.use-cache.outputs.cache-hit != 'true' }}

      run: |
        pipx install poetry==${{ inputs.poetry-version }}
      shell: bash
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}
        cache: "poetry"
    -  run: poetry install
       shell: bash
    -  if: inputs.command != ''
       run: poetry run ${{ inputs.command }}
       shell: bash
